
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: knowflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowflow
      POSTGRES_USER: knowflow_user
      POSTGRES_PASSWORD: knowflow_dev_password
    ports:
      - "5433:5432"
    volumes:
      - knowflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowflow_user -d knowflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: knowflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - knowflow_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  knowflow_postgres_data:
  knowflow_redis_data:
